<html><body><pre id="result">RUNNING</pre><script type="module">
import { useChat } from '/src/stores/useChat.ts'
const result = document.querySelector('#result')
const wait = ms => new Promise(r => setTimeout(r, ms))
const until = async (fn, label, ms = 6000) => {
  const t = Date.now()
  while (Date.now() - t < ms) { if (fn()) return; await wait(20) }
  throw Error('超时：' + label)
}
const check = (ok, msg) => { if (!ok) throw Error(msg) }
try {
  localStorage.clear()
  const chat = useChat()
  window.__chat = chat // 失败时方便在控制台里看状态
  await chat.setupWailsEvents()

  // 会话 A：发一条会停在审批上的消息
  await chat.newSession()
  const A = chat.sessionId.value
  await chat.sendMessage('请帮我做个需要审批的改动')
  await until(() => chat.messages.value.some(m => m.type === 'reasoning' && m.content.includes('再决定')), '思考内容累积到消息里')
  const thinking = chat.messages.value.find(m => m.type === 'reasoning')
  check(thinking.content === '先看一下界面现状，再决定要不要调用工具。', '思考内容应完整累积：' + thinking.content)

  // 运行到一半切到新会话 B：A 不能被取消，B 不能被 A 的状态污染
  await chat.newSession()
  const B = chat.sessionId.value
  check(A !== B, '应切到新会话')
  check(!chat.sending.value && !chat.awaitingInteract.value, '新会话不应继承 A 的运行状态')
  check(chat.runBadges.value[A] === 'running' || chat.runBadges.value[A] === 'awaiting', 'A 应在会话列表里标为运行中/等待：' + chat.runBadges.value[A])
  await until(() => chat.runBadges.value[A] === 'awaiting', 'A 在后台停到审批上')
  check(!chat.messages.value.some(m => m.type === 'tool_call' || m.type === 'reasoning' || m.type === 'approval'), 'A 的事件不应写进 B')
  check(!chat.sending.value, 'B 仍应是空闲的')

  // 切回 A：流式过程中的状态原样都在
  await chat.selectSession(A)
  check(chat.sessionId.value === A, '应切回 A')
  check(chat.awaitingInteract.value, '切回后应仍在等待批准')
  check(chat.messages.value.some(m => m.type === 'reasoning'), '思考块应保留')
  check(chat.messages.value.some(m => m.type === 'tool_call' && m.status === 'success'), '工具气泡应保留且已成功')
  const approval = chat.messages.value.find(m => m.type === 'approval' && !m.resolved)
  check(approval, '待批准卡片应保留')

  // 批准后继续跑完，不能报错
  await chat.handleApprove(approval.approval_id)
  await until(() => !chat.sending.value && !chat.awaitingInteract.value, '批准后续跑结束')
  const texts = chat.messages.value.filter(m => m.type === 'text' && m.role === 'assistant').map(m => m.content).join('|')
  check(texts.includes('审批续跑'), '批准后应出现续跑文本：' + texts)
  check(!texts.includes('错误'), '不应出现错误：' + texts)
  check(approval.resolved, '审批卡片应标为已处理')

  // 第二轮：发出后马上切走，A 在后台跑完，切回来结果和工具气泡都在
  await chat.sendMessage('再来一轮普通对话')
  check(chat.sending.value, 'A 应在运行')
  await chat.selectSession(B)
  check(!chat.sending.value, 'B 应空闲')
  await until(() => !chat.runBadges.value[A], 'A 在后台跑完')
  await chat.selectSession(A)
  const last = chat.messages.value.filter(m => m.type === 'text' && m.role === 'assistant').pop()
  check(last && last.content.includes('统一事件流已连接'), '切回后应看到后台跑完的回答：' + (last && last.content))
  check(chat.messages.value.filter(m => m.type === 'tool_call').length >= 2, '已完成会话切回后工具气泡应保留')
  check(!chat.sending.value, '跑完的会话不应还在运行')

  // 停止只作用于当前会话
  await chat.sendMessage('再来一轮用来停止')
  await chat.selectSession(B)
  await chat.sendMessage('B 里也发一条')
  await chat.stopGeneration()
  check(!chat.sending.value, 'B 停止后应空闲')
  check(chat.runBadges.value[A] === 'running', '停 B 不应影响后台的 A：' + chat.runBadges.value[A])
  await until(() => !chat.runBadges.value[A], 'A 仍然正常跑完')

  result.textContent = 'PASS: 切换会话保留运行状态、后台会话持续接收事件、思考内容累积、批准后无误报、停止只作用于当前会话'
} catch (e) { result.textContent = 'FAIL: ' + e.message }
</script></body></html>
