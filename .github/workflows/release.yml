name: Release

# Windows only, on purpose. Linux and macOS are still compiled on every push by ci.yml (go-portable).
# The desktop package is built by scripts/release-windows.ps1, the script a maintainer runs locally, so a CI
# package and a local one are the same thing: `production` build tag (without it Wails runs in dev mode),
# Windows icon and manifest, the version stamped into the binary, README, licenses and a build receipt.
# Go tests run in ci.yml on every push to master and are not repeated here (-SkipTests; the receipt says so).
# The Windows 7 packages are not built here: they need the legacy toolchain, see scripts/release-win7.ps1.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: wails3 (embeds the icon and manifest)
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.6
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path (go env GOPATH) 'bin')
      - name: package
        shell: pwsh
        run: |
          # tag v1.2.0 -> 1.2.0; a manual run on a branch gets a throwaway version
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          ./scripts/release-windows.ps1 -Version $ver -SkipTests
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            bin/agentgo-*-windows-amd64.zip
            bin/agentgo-*-windows-amd64.zip.sha256
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: agentgo-windows
          path: bin/agentgo-*-windows-amd64.zip
