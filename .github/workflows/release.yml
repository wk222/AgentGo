name: Release

# Windows builds only, on purpose. Linux and macOS are still compiled on every push by ci.yml (go-portable).
# The Windows 7 packages are not built here: they need the legacy toolchain, see scripts/release-win7.ps1.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: build binaries
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          $ver = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/agentgo.exe ./cmd/agentgo
          go build -trimpath -ldflags "-s -w" -o dist/agentgo-cli.exe ./cmd/agentgo-cli
          go build -trimpath -ldflags "-s -w" -o dist/agentgo-cua.exe ./cmd/agentgo-cua
          go build -trimpath -tags web -ldflags "-s -w" -o dist/agentgo-web.exe ./cmd/agentgo-web
          Compress-Archive -Path dist/*.exe -DestinationPath "agentgo-$ver-windows-amd64.zip" -Force
          (Get-FileHash "agentgo-$ver-windows-amd64.zip" -Algorithm SHA256).Hash.ToLower() + "  agentgo-$ver-windows-amd64.zip" | Set-Content "agentgo-$ver-windows-amd64.zip.sha256"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            agentgo-*-windows-amd64.zip
            agentgo-*-windows-amd64.zip.sha256
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: agentgo-windows
          path: dist/*.exe
